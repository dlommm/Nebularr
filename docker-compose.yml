# Default stack: optional bundled Postgres (profile `nebularr-bundled-postgres`) + app (non-root,
# read-only root, caps dropped). Enable the profile in `.env` (`COMPOSE_PROFILES`) or use
# `./scripts/one-click-all-in-one.sh`, which respects `NEBULARR_BUNDLED_POSTGRES`. Omit the profile
# to run app-only against an external Postgres (wizard host must reach that server).
services:
  postgres:
    profiles:
      - nebularr-bundled-postgres
    # Minor-pinned; bump deliberately alongside a compose pull + release note.
    image: postgres:16.10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arranalytics}
      POSTGRES_USER: ${POSTGRES_USER:-arradmin}
      # Change this before first start (scripts/one-click-all-in-one.sh generates one).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arradmin}
    # Stock Postgres ships a 128MB shared_buffers and a random_page_cost that
    # assumes a spinning disk. On a real library (133k episodes / 111k files,
    # ~850MB of hot tables) that measured a 10.9% cache hit ratio, because
    # neither big table fits in the buffer pool. Every value below is an env
    # override so a small box can stay small; the defaults suit ~8GB of RAM.
    # See docs/DATABASE-TUNING.md for the per-RAM table.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      # SSD/NVMe. Raise toward 4 only if the data volume is a spinning disk.
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - default_statistics_target=${POSTGRES_STATISTICS_TARGET:-200}
    # Parallel workers exchange tuples through /dev/shm, which Docker caps at 64MB
    # by default; too small and a parallel scan dies on "could not resize shared
    # memory segment".
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arradmin} -d ${POSTGRES_DB:-arranalytics}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-2.9.3}
        GIT_SHA: ${APP_GIT_SHA:-release}
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # App reads only process env inside the container (.env is not copied into the image; see .dockerignore).
      NEBULARR_ENV_FROM_PROCESS_ONLY: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      # Optional: set DATABASE_URL to skip the Web UI database step (e.g. CI). Otherwise the
      # wizard collects Postgres settings and persists the URL under /app/data.
      DATABASE_URL: ${DATABASE_URL:-}
      ENABLE_BOOTSTRAP_MIGRATIONS: ${ENABLE_BOOTSTRAP_MIGRATIONS:-true}
      NEBULARR_RUNTIME_DIR: /app/data
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - nebularr_runtime:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

volumes:
  postgres_data:
  nebularr_runtime:
