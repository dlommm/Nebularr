# Nebularr stack for Unraid (Compose Manager / docker compose).
#
# --- Host paths (defaults below) ---
# Default base: /mnt/user/appdata/nebularr
#
# 1) Create folders before `docker compose up`:
#    mkdir -p /mnt/user/appdata/nebularr/{postgres,runtime,webserver}
#
# 2) First boot: set DATABASE_URL to the Postgres superuser (same user/password as POSTGRES_*).
#    After the Web UI "Database" step (or bootstrap API), Nebularr saves the arrapp URL under
#    .../runtime and overrides DATABASE_URL on the next container start. You may then remove
#    DATABASE_URL from this file if you prefer.
#
# 3) If your base path is NOT /mnt/user/appdata/nebularr, update every host path below the same way.
#
# --- Template notes ---
# * The app container is hardened like the root compose file: non-root user, read-only
#   rootfs, all capabilities dropped, no-new-privileges. No action needed.
# * Postgres is NOT published to the host by default. Nebularr reaches it over the
#   private compose network. If other LAN tools need direct Postgres access, restore:
#       ports:
#         - "${POSTGRES_PORT:-5432}:5432"
#   under the postgres service (and prefer binding to a specific host IP).
# * The image tag is pinned to a version instead of :latest so upgrades are deliberate;
#   it is kept in sync with each release by scripts/check-version-sync.sh.
# * POSTGRES_PASSWORD has no default here on purpose — set it in .env before first start.

services:
  postgres:
    image: postgres:16.10
    container_name: nebularr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arranalytics}
      POSTGRES_USER: ${POSTGRES_USER:-arradmin}
      # Required: set a real password in .env before first start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting}
    # Stock Postgres ships a 128MB shared_buffers and a random_page_cost that
    # assumes a spinning disk. On a real library (133k episodes / 111k files,
    # ~850MB of hot tables) that measured a 10.9% cache hit ratio, because
    # neither big table fits in the buffer pool. Every value below is an env
    # override so a small box can stay small; the defaults suit ~8GB of RAM.
    # See docs/DATABASE-TUNING.md for the per-RAM table.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
      # SSD/NVMe. Raise toward 4 only if the data volume is a spinning disk.
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}
      - -c
      - default_statistics_target=${POSTGRES_STATISTICS_TARGET:-200}
    # Parallel workers exchange tuples through /dev/shm, which Docker caps at 64MB
    # by default; too small and a parallel scan dies on "could not resize shared
    # memory segment".
    shm_size: ${POSTGRES_SHM_SIZE:-1gb}
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/user/appdata/nebularr/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arradmin} -d ${POSTGRES_DB:-arranalytics}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nebularr

  app:
    image: ${NEBULARR_IMAGE:-dendlomm/nebularr:2.9.3}
    container_name: nebularr
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NEBULARR_ENV_FROM_PROCESS_ONLY: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-UTC}
      DATABASE_URL: ${DATABASE_URL:-}
      ENABLE_BOOTSTRAP_MIGRATIONS: ${ENABLE_BOOTSTRAP_MIGRATIONS:-true}
      NEBULARR_RUNTIME_DIR: /app/data
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - /mnt/user/appdata/nebularr/runtime:/app/data
      - /mnt/user/appdata/nebularr/webserver:/var/lib/nebularr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nebularr

networks:
  nebularr:
    name: nebularr
